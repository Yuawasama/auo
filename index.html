<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0b1a">
<title>艾瑟兰编年史 · 日式西幻人生</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c9a227' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='M6 3h9l4 4v14H6z'/><path d='M15 3v4h4'/><path d='M9 12h6M9 16h4'/></svg>">
<style>
:root{
  --bg:#0d0b1a; --bg2:#151228; --card:#1c1834; --card2:#241f42;
  --line:#332c58; --line2:#453c72;
  --txt:#e8e4ff; --dim:#9b93c4; --dim2:#6d6596;
  --gold:#e8c26a; --pink:#ff8fb8; --cyan:#6fe0e0; --purple:#a78bfa;
  --green:#7ee787; --red:#ff6b81;
  --safe: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.65; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
#app{
  position:fixed; inset:0; display:flex; flex-direction:column;
  max-width:560px; margin:0 auto;
  background:radial-gradient(ellipse at 50% 0%, #1a1535 0%, #0d0b1a 60%);
}
/* 顶栏 */
#hud{
  flex:0 0 auto; padding:10px 14px 8px;
  background:linear-gradient(180deg,rgba(28,24,52,.98),rgba(28,24,52,.85));
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(8px); z-index:10;
}
.hud-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
.hud-name{font-weight:700;font-size:15px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hud-age{font-size:12px;color:var(--dim);white-space:nowrap;}
.hud-btns{display:flex;gap:6px;}
.hud-btns button{
  background:var(--card2);border:1px solid var(--line2);color:var(--dim);
  border-radius:8px;padding:3px 9px;font-size:12px;cursor:pointer;
}
.hud-btns button:active{background:var(--line2);}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.stat{background:var(--bg2);border-radius:7px;padding:4px 6px;text-align:center;}
.stat .k{font-size:10px;color:var(--dim2);letter-spacing:.5px;}
.stat .v{font-size:15px;font-weight:700;color:var(--txt);}
.stat.gold .v{color:var(--gold);}
.stat.mag .v{color:var(--purple);}
.stat.int .v{color:var(--cyan);}
.stat.phy .v{color:var(--green);}
/* 正文区 */
#stage{
  flex:1 1 auto; overflow-y:auto; overflow-x:hidden;
  padding:16px 16px 24px; -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
}
#stage::-webkit-scrollbar{width:4px;}
#stage::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px;}
.para{margin:0 0 14px; animation:fadeUp .35s ease both;}
.para.narr{color:var(--txt);}
.para.think{color:var(--dim);font-style:italic;font-size:14px;}
.para.sys{color:var(--cyan);font-size:13px;background:rgba(111,224,224,.07);border-left:2px solid var(--cyan);padding:6px 10px;border-radius:0 6px 6px 0;}
.para.good{color:var(--green);font-size:13.5px;}
.para.bad{color:var(--red);font-size:13.5px;}
.para.gold{color:var(--gold);}
.para.dice{color:var(--gold);font-size:13px;text-align:center;background:rgba(232,194,106,.08);border:1px dashed rgba(232,194,106,.35);border-radius:8px;padding:8px;}
.para.chapter{text-align:center;color:var(--gold);font-size:16px;font-weight:700;letter-spacing:2px;margin:22px 0 18px;padding:10px 0;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
/* 选项区 */
#choices{
  flex:0 0 auto; padding:10px 14px calc(12px + var(--safe));
  background:linear-gradient(0deg,rgba(21,18,40,.99),rgba(21,18,40,.9));
  border-top:1px solid var(--line); max-height:52vh; overflow-y:auto;
}
#choices::-webkit-scrollbar{width:3px;}
#choices::-webkit-scrollbar-thumb{background:var(--line2);}
.choice{
  display:block; width:100%; text-align:left;
  background:var(--card); border:1px solid var(--line2);
  color:var(--txt); border-radius:11px; padding:11px 14px;
  margin-bottom:8px; font-size:14.5px; line-height:1.5;
  cursor:pointer; transition:all .15s; font-family:inherit;
  position:relative;
}
.choice:last-child{margin-bottom:0;}
.choice:active{background:var(--card2);transform:scale(.985);}
.choice .req{display:block;font-size:11.5px;color:var(--dim2);margin-top:3px;}
.choice .req.ok{color:var(--green);}
.choice .req.no{color:var(--red);}
.choice.locked{opacity:.45;cursor:not-allowed;}
.choice.locked:active{transform:none;background:var(--card);}
.choice.danger{border-color:rgba(255,107,129,.4);}
.choice.danger .t{color:var(--red);}
.choice.special{border-color:rgba(232,194,106,.5);background:linear-gradient(135deg,rgba(232,194,106,.1),var(--card));}
.choice.special .t{color:var(--gold);}
.choice .t{font-weight:500;}
/* 弹窗 */
.modal-mask{
  position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:20px;
  animation:fadeIn .2s; backdrop-filter:blur(3px);
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--card); border:1px solid var(--line2); border-radius:16px;
  padding:20px; max-width:400px; width:100%; max-height:80vh; overflow-y:auto;
  animation:pop .25s cubic-bezier(.2,1.3,.5,1);
}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{margin:0 0 12px;color:var(--gold);font-size:17px;text-align:center;}
.modal p{margin:0 0 10px;font-size:14px;color:var(--dim);}
.modal .btn-row{display:flex;gap:10px;margin-top:16px;}
.modal .btn-row button{
  flex:1;padding:11px;border-radius:10px;border:1px solid var(--line2);
  background:var(--card2);color:var(--txt);font-size:14.5px;cursor:pointer;font-family:inherit;
}
.modal .btn-row button.primary{background:linear-gradient(135deg,#6b5bd0,#a78bfa);border-color:transparent;color:#fff;font-weight:600;}
.modal .btn-row button.danger{background:rgba(255,107,129,.15);border-color:rgba(255,107,129,.5);color:var(--red);}
.modal img.qr{width:100%;max-width:260px;display:block;margin:10px auto;border-radius:10px;background:#fff;padding:8px;}
/* 开局面板 */
.panel{padding:4px 0;}
.panel h2{font-size:19px;color:var(--gold);margin:0 0 6px;text-align:center;letter-spacing:1px;}
.panel .sub{text-align:center;color:var(--dim);font-size:13px;margin-bottom:16px;}
.pts-badge{
  position:sticky;top:0;z-index:5;text-align:center;margin-bottom:14px;
  background:linear-gradient(135deg,rgba(232,194,106,.15),rgba(167,139,250,.15));
  border:1px solid rgba(232,194,106,.4);border-radius:10px;padding:8px;
  font-size:14px;color:var(--gold);font-weight:600;backdrop-filter:blur(6px);
}
.pts-badge .n{font-size:20px;color:#fff;}
.race-grid{display:grid;grid-template-columns:1fr;gap:9px;}
.race-card{
  background:var(--card);border:1px solid var(--line2);border-radius:12px;
  padding:12px 14px;cursor:pointer;transition:all .15s;position:relative;
}
.race-card:active{transform:scale(.99);}
.race-card.sel{border-color:var(--gold);background:linear-gradient(135deg,rgba(232,194,106,.12),var(--card));}
.race-card.locked{opacity:.4;cursor:not-allowed;}
.race-card .rc-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.race-card .rc-name{font-size:16px;font-weight:700;color:var(--txt);}
.race-card .rc-cost{font-size:12px;color:var(--gold);white-space:nowrap;}
.race-card .rc-desc{font-size:12.5px;color:var(--dim);margin-top:5px;line-height:1.5;}
.race-card .rc-bonus{font-size:12px;color:var(--cyan);margin-top:5px;}
.attr-row{
  display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--line2);border-radius:11px;padding:10px 12px;margin-bottom:9px;
}
.attr-row .an{flex:0 0 52px;font-size:14px;font-weight:600;}
.attr-row .ad{flex:1;font-size:11.5px;color:var(--dim2);}
.attr-row .ctrl{display:flex;align-items:center;gap:8px;}
.attr-row .ctrl button{
  width:32px;height:32px;border-radius:8px;border:1px solid var(--line2);
  background:var(--card2);color:var(--txt);font-size:18px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-family:inherit;
}
.attr-row .ctrl button:disabled{opacity:.3;}
.attr-row .ctrl .val{width:34px;text-align:center;font-size:17px;font-weight:700;color:var(--gold);}
.big-btn{
  width:100%;padding:14px;border-radius:12px;border:none;
  background:linear-gradient(135deg,#6b5bd0,#a78bfa);color:#fff;
  font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;font-family:inherit;
  letter-spacing:1px;
}
.big-btn:disabled{opacity:.4;}
.big-btn:active:not(:disabled){transform:scale(.98);}
.big-btn.ghost{background:var(--card2);border:1px solid var(--line2);color:var(--txt);font-weight:500;}
/* 天赋列表 */
.talent-item{
  display:flex;gap:10px;align-items:flex-start;background:var(--card);
  border:1px solid var(--line2);border-radius:11px;padding:10px 12px;margin-bottom:8px;cursor:pointer;
}
.talent-item.sel{border-color:var(--gold);background:linear-gradient(135deg,rgba(232,194,106,.1),var(--card));}
.talent-item.dis{opacity:.4;}
.talent-item .ti-name{font-size:14px;font-weight:600;}
.talent-item .ti-cost{font-size:11.5px;color:var(--gold);margin-left:6px;}
.talent-item .ti-desc{font-size:12px;color:var(--dim);margin-top:3px;}
/* 存档列表 */
.save-item{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--card);border:1px solid var(--line2);border-radius:11px;
  padding:11px 13px;margin-bottom:9px;
}
.save-item .si-info{flex:1;min-width:0;}
.save-item .si-title{font-size:14px;font-weight:600;color:var(--gold);}
.save-item .si-meta{font-size:11.5px;color:var(--dim2);margin-top:2px;}
.save-item .si-btns{display:flex;gap:6px;flex:0 0 auto;}
.save-item .si-btns button{
  padding:6px 11px;border-radius:8px;border:1px solid var(--line2);
  background:var(--card2);color:var(--txt);font-size:12.5px;cursor:pointer;font-family:inherit;
}
.save-item .si-btns button.del{color:var(--red);border-color:rgba(255,107,129,.3);}
/* 死亡总结 */
.summary-box{background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:14px;margin-bottom:14px;}
.summary-box .sb-title{font-size:13px;color:var(--gold);margin-bottom:8px;font-weight:600;}
.summary-box .sb-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line);}
.summary-box .sb-row:last-child{border-bottom:none;}
.summary-box .sb-row .k{color:var(--dim);}
.summary-box .sb-row .v{color:var(--txt);font-weight:600;}
.epitaph{text-align:center;font-size:15px;color:var(--gold);font-style:italic;padding:16px 10px;line-height:1.8;}
/* 自绘图标 */
.ico{display:inline-block;vertical-align:-0.18em;flex:0 0 auto;}
.race-card .rc-name .ico{color:var(--gold);vertical-align:-0.22em;margin-right:2px;}
.choice .ico{color:var(--gold);margin-right:2px;}
.para .ico{color:var(--gold);vertical-align:-0.2em;}
#tip-link .ico{vertical-align:-0.2em;}
/* 打赏 */
#tip-link{
  text-align:center;padding:14px 0 calc(14px + var(--safe));
  font-size:12.5px;color:var(--dim2);cursor:pointer;
  border-top:1px solid var(--line);background:var(--bg2);
  flex:0 0 auto;
}
#tip-link:active{color:var(--gold);}
/* 骰子动画 */
.dice-roll{
  display:inline-block;font-size:22px;animation:shake .5s ease;
}
@keyframes shake{
  0%,100%{transform:rotate(0)}
  25%{transform:rotate(-15deg) scale(1.1)}
  75%{transform:rotate(15deg) scale(1.1)}
}
/* 属性变化飘字 */
.float-tip{
  position:fixed;z-index:200;font-size:14px;font-weight:700;pointer-events:none;
  animation:floatUp 1.2s ease-out forwards;
}
@keyframes floatUp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-50px)}}
@media(max-width:360px){
  body{font-size:14px;}
  .stats{grid-template-columns:repeat(4,1fr);gap:4px;}
  .stat .v{font-size:13px;}
}
</style>
</head>
<body>
<div id="app">
  <div id="hud" style="display:none">
    <div class="hud-top">
      <div class="hud-name" id="hudName">—</div>
      <div class="hud-age" id="hudAge">—</div>
      <div class="hud-btns">
        <button onclick="Game.openSave()">存档</button>
        <button onclick="Game.openMenu()">菜单</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat gold"><div class="k">家底</div><div class="v" id="stGold">0</div></div>
      <div class="stat mag"><div class="k">魔法</div><div class="v" id="stMag">0</div></div>
      <div class="stat int"><div class="k">智力</div><div class="v" id="stInt">0</div></div>
      <div class="stat phy"><div class="k">体魄</div><div class="v" id="stPhy">0</div></div>
    </div>
  </div>
  <div id="stage"></div>
  <div id="choices"></div>
  <div id="tip-link" onclick="Game.showQR()"><span id="tip-ico"></span> 喜欢这个故事？请作者喝杯咖啡</div>
</div>
<div id="modalRoot"></div>
<script src="icons.js?v=3"></script>
<script src="data.js?v=3"></script>
<script src="game.js?v=3"></script>
<script>document.getElementById('tip-ico').innerHTML = icon('coffee',16);</script>
</body>
</html>
